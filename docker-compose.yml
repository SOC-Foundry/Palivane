# Self-host / local stack: Postgres + the SAME single-origin image CI builds and deploys to
# Cloud Run (deploy/cloudrun/Dockerfile) — SPA + API + the /install.sh & /cli distribution
# endpoints, all on one port. Building the canonical image (not a separate backend+nginx
# pair) means a self-hosted deployment always includes exactly what the SaaS runs.
#
#   cp .env.docker.example .env   # set PALIVANE_SECRET_KEY (openssl rand -hex 32)
#   docker compose up --build
# Then open http://localhost:8080  (login: admin@demo.local / changeme123 when seeded).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warden}
      POSTGRES_DB: ${POSTGRES_DB:-warden}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warden}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: deploy/cloudrun/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-warden}:${POSTGRES_PASSWORD:-warden}@db:5432/${POSTGRES_DB:-warden}
      PALIVANE_SECRET_KEY: "${PALIVANE_SECRET_KEY:?set a strong PALIVANE_SECRET_KEY in .env (openssl rand -hex 32)}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PALIVANE_PUBLIC_URL: ${PALIVANE_PUBLIC_URL:-http://localhost:8080}
      SEED_ON_START: ${SEED_ON_START:-false}
      PALIVANE_ALLOW_SIGNUP: ${PALIVANE_ALLOW_SIGNUP:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123}
      # Findings-at-rest posture (self-host can choose to keep content).
      PALIVANE_ENCRYPT_FINDINGS: ${PALIVANE_ENCRYPT_FINDINGS:-true}
      PALIVANE_STORE_CONTENT: ${PALIVANE_STORE_CONTENT:-false}
      # Optional: LLM judge (bring your own key).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-auto}
      # Optional: gateway upstreams, capture token, tenant.
      GATEWAY_ENFORCE: ${GATEWAY_ENFORCE:-false}
      GATEWAY_ANTHROPIC_BASE: ${GATEWAY_ANTHROPIC_BASE:-https://api.anthropic.com}
      GATEWAY_ANTHROPIC_KEY: ${GATEWAY_ANTHROPIC_KEY:-}
      EXTENSION_INGEST_TOKEN: ${EXTENSION_INGEST_TOKEN:-}
      INGEST_TENANT: ${INGEST_TENANT:-demo}
      PALIVANE_EXTENSION_ID: ${PALIVANE_EXTENSION_ID:-}
      # Optional: email plane (SMTP) for reset / verification / invites.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
