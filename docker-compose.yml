# Self-host / local stack: Postgres + the SAME single-origin image CI builds and deploys to
# Cloud Run (deploy/cloudrun/Dockerfile) — SPA + API + the /install.sh & /cli distribution
# endpoints, all on one port. Building the canonical image (not a separate backend+nginx
# pair) means a self-hosted deployment always includes exactly what the SaaS runs.
#
#   cp .env.docker.example .env   # set PALIVANE_SECRET_KEY (openssl rand -hex 32)
#   docker compose up --build
# Then open http://localhost:8080  (login: admin@demo.local / changeme123 when seeded).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palivane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-palivane}
      POSTGRES_DB: ${POSTGRES_DB:-palivane}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palivane}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: deploy/cloudrun/Dockerfile
      args:
        # This stack IS a self-hosted install, so the site may make the stronger (true)
        # claim: prompt text never leaves the operator's own infrastructure.
        VITE_PALIVANE_SELF_HOSTED: "1"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-palivane}:${POSTGRES_PASSWORD:-palivane}@db:5432/${POSTGRES_DB:-palivane}
      PALIVANE_SECRET_KEY: "${PALIVANE_SECRET_KEY:?set a strong PALIVANE_SECRET_KEY in .env (openssl rand -hex 32)}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PALIVANE_PUBLIC_URL: ${PALIVANE_PUBLIC_URL:-http://localhost:8080}
      SEED_ON_START: ${SEED_ON_START:-false}
      PALIVANE_ALLOW_SIGNUP: ${PALIVANE_ALLOW_SIGNUP:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123}
      # Findings-at-rest posture (self-host can choose to keep content).
      PALIVANE_ENCRYPT_FINDINGS: ${PALIVANE_ENCRYPT_FINDINGS:-true}
      PALIVANE_STORE_CONTENT: ${PALIVANE_STORE_CONTENT:-false}
      # Optional: Prometheus scrape token. /metrics answers 404 until it is set; scrape
      # with `Authorization: Bearer <token>` (or ?token=).
      PALIVANE_METRICS_TOKEN: ${PALIVANE_METRICS_TOKEN:-}
      # Optional: LLM judge (bring your own key).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-auto}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      # Optional: gateway upstreams, capture token, tenant.
      # Compose passes ONLY the variables listed here, so every knob .env.docker.example
      # documents must appear below or setting it in .env silently does nothing.
      GATEWAY_ENFORCE: ${GATEWAY_ENFORCE:-false}
      # Hook/proxy default for devices with no local flag; same monitor default as the
      # gateway. Set both to true together to enforce everywhere.
      CLIENT_ENFORCE: ${CLIENT_ENFORCE:-false}
      # Image OCR (tesseract is in the image); off unless set.
      PALIVANE_OCR: ${PALIVANE_OCR:-false}
      GATEWAY_BLOCK_SEVERITY: ${GATEWAY_BLOCK_SEVERITY:-high}
      GATEWAY_UPSTREAM_BASE: ${GATEWAY_UPSTREAM_BASE:-}
      GATEWAY_UPSTREAM_KEY: ${GATEWAY_UPSTREAM_KEY:-}
      GATEWAY_ANTHROPIC_BASE: ${GATEWAY_ANTHROPIC_BASE:-https://api.anthropic.com}
      GATEWAY_ANTHROPIC_KEY: ${GATEWAY_ANTHROPIC_KEY:-}
      GATEWAY_GEMINI_BASE: ${GATEWAY_GEMINI_BASE:-https://generativelanguage.googleapis.com}
      GATEWAY_GEMINI_KEY: ${GATEWAY_GEMINI_KEY:-}
      # Optional: MCP inspection via the egress proxy.
      MCP_ENFORCE: ${MCP_ENFORCE:-false}
      MCP_BLOCK_SEVERITY: ${MCP_BLOCK_SEVERITY:-high}
      MCP_ALLOWED_SERVERS: ${MCP_ALLOWED_SERVERS:-}
      EXTENSION_INGEST_TOKEN: ${EXTENSION_INGEST_TOKEN:-}
      INGEST_TENANT: ${INGEST_TENANT:-demo}
      PALIVANE_EXTENSION_ID: ${PALIVANE_EXTENSION_ID:-}
      # Optional: email plane (SMTP) for reset / verification / invites.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
