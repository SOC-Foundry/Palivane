name: "Warden secret & PII scan"
description: "Scan a pull request's changed files for secrets and PII via your Warden backend."
branding:
  icon: shield
  color: blue
inputs:
  warden-url:
    description: "Warden backend base URL (e.g. https://warden.corp.example.com)."
    required: true
  warden-token:
    description: "A Warden API key (ak_…). Pass from a repo/org secret."
    required: true
  strict:
    description: "Fail the check on warn-level findings too (not just blocks)."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Warden secret & PII scan
      shell: bash
      env:
        WARDEN_URL: ${{ inputs.warden-url }}
        WARDEN_TOKEN: ${{ inputs.warden-token }}
      run: |
        base="${{ github.event.pull_request.base.sha }}"
        head="${{ github.event.pull_request.head.sha }}"
        range="${base:-HEAD~1}..${head:-HEAD}"
        echo "Scanning range: $range"
        python3 "$GITHUB_ACTION_PATH/warden_git_scan.py" \
          --range "$range" --fail-closed \
          ${{ inputs.strict == 'true' && '--strict' || '' }}
