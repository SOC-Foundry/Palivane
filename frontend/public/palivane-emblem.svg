<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Palivane">
  <!-- Palivane mark: tall stem, a capsule, two dots, and a dropped capsule — a glossy
       green rhythm. Brand green with a lit gradient, top sheen, and a soft glow. -->
  <defs>
    <linearGradient id="pf" x1="14" y1="6" x2="86" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68D6AC"/>
      <stop offset="1" stop-color="#2C9E77"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".40"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pw" x="-25%" y="-20%" width="150%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#4FD69D" flood-opacity=".35"/>
    </filter>
    <clipPath id="pc">
      <rect x="16.5" y="6" width="14" height="88" rx="7"/>
      <rect x="34.5" y="6" width="14" height="45" rx="7"/>
      <circle cx="58.5" cy="10" r="4.5"/>
      <circle cx="58.5" cy="47" r="4.5"/>
      <rect x="69.5" y="14" width="14" height="30" rx="7"/>
    </clipPath>
  </defs>
  <g filter="url(#pw)" fill="url(#pf)">
    <rect x="16.5" y="6" width="14" height="88" rx="7"/>
    <rect x="34.5" y="6" width="14" height="45" rx="7"/>
    <circle cx="58.5" cy="10" r="4.5"/>
    <circle cx="58.5" cy="47" r="4.5"/>
    <rect x="69.5" y="14" width="14" height="30" rx="7"/>
  </g>
  <rect x="0" y="0" width="100" height="30" fill="url(#pg)" clip-path="url(#pc)"/>
</svg>
