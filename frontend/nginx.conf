server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser security headers for the SPA (the API sets its own on backend responses).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # SPA: serve index.html for any non-asset route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls and the OpenAI-compatible LLM gateway to the backend.
    location ~ ^/(api|v1)/ {
        proxy_pass http://backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
