name: Terraform plan / apply (infra)

# MANUAL ONLY (workflow_dispatch), and PLAN-ONLY unless `apply` is ticked: a dispatch shows
# what Terraform would change against the real state, in the run summary, and touches nothing.
#
# Whether prod is in state is unconfirmed. The July 2026 note here said prod was hand-built
# and not in state; that was the old project. deploy/terraform/README says the current
# `palivane` project was provisioned by this config, so it should be. A plan-only run settles
# it. If the plan creates the stack, adopt it (README: adopt_existing + import.sh) before any
# apply.
#
# Guard, on apply: the job applies only the plan it just made, and refuses that plan if it
# would delete or replace anything, or create a core resource (database, Cloud Run service,
# secrets, network, registry). A brand-new environment, built from nothing on purpose, sets
# allow_core_changes.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (unticked = plan only, changes nothing)"
        type: boolean
        default: false
      allow_core_changes:
        description: "Allow creating core resources and any delete/replace (new environment only)"
        type: boolean
        default: false
  # push:
  #   branches: [main]
  #   paths:
  #     - "deploy/terraform/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    # Prod-affecting: only from main. The WIF provider refuses any other ref anyway
    # (deploy/gcp/setup-wif.sh); this makes a dispatch from a branch skip visibly instead
    # of failing at the token exchange.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-infra   # add required reviewers for manual approval
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_image: ${{ vars.DEPLOY_IMAGE }} # ignored by lifecycle; any valid ref works
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=palivane"
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Summarize the plan
        # Addresses and actions only: values can be sensitive (state holds the secret key).
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json
          plan = json.load(open("plan.json"))
          rows = [(rc["address"], "/".join(rc["change"]["actions"]))
                  for rc in plan.get("resource_changes", []) if rc["change"]["actions"] != ["no-op"]]
          managed = sum(1 for rc in plan.get("resource_changes", []) if rc["mode"] == "managed")
          counts = collections.Counter(a for _, a in rows)
          print(f"### Terraform plan\n\n{managed} managed resources in config; "
                f"{len(rows)} would change: {dict(counts) or 'none'}\n")
          if rows:
              print("| Resource | Action |\n| --- | --- |")
              for addr, act in sorted(rows):
                  print(f"| `{addr}` | {act} |")
          PY

      - name: Refuse a plan that would rebuild or destroy prod
        if: inputs.apply
        env:
          ALLOW: ${{ inputs.allow_core_changes }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          # Creating one of these means Terraform does not know the live one exists.
          CORE = {"google_sql_database_instance", "google_sql_database", "google_sql_user",
                  "google_cloud_run_v2_service", "google_secret_manager_secret",
                  "google_secret_manager_secret_version", "random_password",
                  "google_compute_network", "google_compute_subnetwork",
                  "google_service_networking_connection", "google_artifact_registry_repository"}
          plan = json.load(open("plan.json"))
          bad = []
          for rc in plan.get("resource_changes", []):
              acts = rc["change"]["actions"]
              if "delete" in acts:
                  bad.append(f"{'replace' if 'create' in acts else 'delete'} {rc['address']}")
              elif "create" in acts and rc["type"] in CORE:
                  bad.append(f"create {rc['address']}")
          if not bad:
              print("Plan touches no core resource and deletes nothing.")
              sys.exit(0)
          print("This plan would:\n  " + "\n  ".join(bad))
          if os.environ.get("ALLOW") == "true":
              print("allow_core_changes is set: applying anyway.")
              sys.exit(0)
          print("::error::Refusing. If this creates the stack, prod is not in Terraform state: adopt it "
                "first (deploy/terraform/README, adopt_existing + import.sh). A new environment can set "
                "allow_core_changes.")
          sys.exit(1)
          PY

      - name: Apply
        # Exactly the plan that passed the guard, not a fresh one.
        if: inputs.apply
        run: terraform apply -input=false tfplan
