name: Terraform apply (infra)

# Infra changes only: applies when Terraform files land on main. Kept separate from the app
# deploy so routine merges don't touch infrastructure. Gate it behind an environment with
# required reviewers for a human approval step.
on:
  push:
    branches: [main]
    paths:
      - "deploy/terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production-infra   # add required reviewers for manual approval
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Apply
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_image: ${{ vars.DEPLOY_IMAGE }} # ignored by lifecycle; any valid ref works
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=warden"
          terraform apply -auto-approve -input=false
