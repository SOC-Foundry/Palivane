name: Catalog growth (auto-PR)

# The recurring half of catalog growth: weekly, pull candidate hosts from the public
# tools lists in scripts/catalog_sources.txt, run them through the classification pipeline,
# and open a PR proposing new ai_catalog.py rows. The PR review is the human gate — names
# and categories in the diff are heuristics to correct, not decisions already made.
#
# Needs a CATALOG_GROWTH_TOKEN repo secret: a fine-grained PAT (or GitHub App token) for
# this repo only, with Contents and Pull requests read/write. The repo keeps "Allow GitHub
# Actions to create and approve pull requests" off, because turning it on would also let any
# workflow's GITHUB_TOKEN approve PRs and satisfy main's required review. So GITHUB_TOKEN
# cannot open this PR. Without the secret the push still happens and the PR step fails
# visibly. The token is used for the push too, so the PR's CI runs; pushes and PRs made
# with GITHUB_TOKEN never trigger workflows.
#
# The mcp-dataset job rebuilds the MCP reputation dataset (backend/tools/mcp_feed_build.py:
# official MCP registry + npm/PyPI + OSV) into gs://$MCP_REPUTATION_BUCKET, not into git
# (~12 MB a week would bloat history). deploy.sh fetches it into the image on the next
# deploy; the app reads it only where PALIVANE_MCP_REPUTATION_FEED=bundled. Uploading needs
# the deploy SA, and WIF issues that only to a main job in the production environment.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max candidates this run"
        default: "40"
      dataset_only:
        description: "Only rebuild the MCP reputation dataset (no catalog PR)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-growth
  cancel-in-progress: false

jobs:
  propose:
    # A scheduled run has no inputs, so it always proposes.
    if: ${{ !inputs.dataset_only }}
    runs-on: ubuntu-latest
    steps:
      # No credential in .git/config while the scripts below parse fetched candidate data:
      # the push token is handed to git only in the push step, after they have run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch + classify candidates
        # The dispatch input goes through env and is validated, never interpolated into the
        # script: an inputs expression inside run: is pasted in before bash parses it, so a
        # crafted value would run as shell.
        env:
          LIMIT: ${{ inputs.limit || '40' }}
        run: |
          case "$LIMIT" in
            ''|*[!0-9]*|?????*) echo "::error::limit must be a positive integer, got: $LIMIT"; exit 1 ;;
          esac
          if [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 1000 ]; then
            echo "::error::limit must be between 1 and 1000, got: $LIMIT"; exit 1
          fi
          python scripts/fetch_candidates.py --limit "$LIMIT" > /tmp/candidates.txt
          python scripts/merge_catalog_rows.py /tmp/candidates.txt | tee /tmp/summary.md
          # The site's tool count is generated from the catalog; CI's frontend-build fails
          # if it is stale. Node builtins only, so the runner's preinstalled node is enough.
          node frontend/scripts/gen-stats.mjs >/dev/null

      - name: Open / refresh the proposal PR
        env:
          GH_TOKEN: ${{ secrets.CATALOG_GROWTH_TOKEN || github.token }}
        run: |
          if git diff --quiet; then
            echo "No new rows this week."
            exit 0
          fi
          git config user.name "palivane-catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          BRANCH="catalog-growth-auto"
          git checkout -B "$BRANCH"
          git add backend/app/ai_catalog.py README.md frontend/src/stats.gen.json
          git commit -m "catalog: weekly growth proposals (auto)"
          # The token rides in a header for this one push, not in the remote URL or config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push -f origin "$BRANCH"
          # Refresh the open proposal PR if there is one. `gh pr edit <branch>` alone picks the
          # branch's newest PR even when it is long merged, and rewrote #67's description.
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --body-file /tmp/summary.md
          else
            gh pr create --head "$BRANCH" \
              --title "catalog: weekly growth proposals (auto)" \
              --body-file /tmp/summary.md
          fi

  # The MCP reputation dataset, in three jobs so that the one parsing data from the internet
  # (registries, npm/PyPI, OSV) holds no credential at all: no GitHub OIDC token, so nothing
  # it runs can mint a GCP token for any service account (security review M12). The two
  # jobs that do touch GCP only copy one file, as GCP_DATASET_SA (objects in the dataset
  # bucket and nothing else; deploy/terraform/service-accounts.tf).
  #
  # Independent of the catalog PR: a source outage here costs nothing but this week's
  # refresh, and the generator refuses to write a truncated dataset, so the object in the
  # bucket is only replaced by a complete one.
  mcp-dataset-fetch:
    if: github.ref == 'refs/heads/main' && vars.MCP_REPUTATION_BUCKET != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      OBJ: gs://${{ vars.MCP_REPUTATION_BUCKET }}/mcp_reputation.json
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DATASET_SA || vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Fetch last week's dataset
        # The generator compares against the previous file (registry count must not drop
        # below --min-ratio of it) and keeps its stamp when nothing changed. First run: none.
        # The bucket itself is Terraform's (deploy/terraform/storage.tf).
        run: |
          mkdir -p prev
          gcloud storage cp "$OBJ" prev/mcp_reputation.json || echo "No previous dataset; building from scratch."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-dataset-prev
          path: prev/
          if-no-files-found: ignore
          retention-days: 1

  mcp-dataset-build:
    needs: mcp-dataset-fetch
    runs-on: ubuntu-latest
    permissions:
      contents: read          # deliberately no id-token: this job parses external data
    env:
      OUT: backend/data/mcp_reputation.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true      # no artifact on the first run
        with:
          name: mcp-dataset-prev
          path: prev/
      - name: Rebuild the MCP reputation dataset
        # Stdlib only, no backend install.
        run: |
          mkdir -p "$(dirname "$OUT")"
          if [ -f prev/mcp_reputation.json ]; then
            cp prev/mcp_reputation.json "$OUT"
            cp prev/mcp_reputation.json /tmp/prev.json
          fi
          python backend/tools/mcp_feed_build.py 2>&1 | tee /tmp/feed.log
          rc="${PIPESTATUS[0]}"
          { echo "### MCP reputation dataset"; tail -n 1 /tmp/feed.log; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || exit "$rc"
          mkdir -p next
          if cmp -s "$OUT" /tmp/prev.json; then
            echo "Dataset unchanged; nothing to upload."
          else
            cp "$OUT" next/mcp_reputation.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-dataset-next
          path: next/
          if-no-files-found: ignore
          retention-days: 1

  mcp-dataset-upload:
    needs: mcp-dataset-build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      OBJ: gs://${{ vars.MCP_REPUTATION_BUCKET }}/mcp_reputation.json
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: next
        continue-on-error: true      # no artifact = unchanged this week
        with:
          name: mcp-dataset-next
          path: next/
      - name: Check the new dataset is one
        # The build job ran internet-sourced code paths; take only a well-formed JSON file.
        if: hashFiles('next/mcp_reputation.json') != ''
        run: python3 -c 'import json,sys; d=json.load(open("next/mcp_reputation.json")); sys.exit(0 if isinstance(d, dict) else "not a JSON object")'
      - name: Authenticate to GCP
        if: hashFiles('next/mcp_reputation.json') != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DATASET_SA || vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: hashFiles('next/mcp_reputation.json') != ''
      - name: Upload
        if: hashFiles('next/mcp_reputation.json') != ''
        run: gcloud storage cp next/mcp_reputation.json "$OBJ"
