name: CI

# PR gate: backend tests, frontend build, Terraform fmt/validate, and (same-repo, when GCP
# creds are configured) a Terraform plan so infra diffs are reviewed before merge.
#
# Also runs on push to main. Not every commit arrives through a PR — deploy.yml is manual
# by design, so shipping a hotfix straight to main is a supported path, and until now those
# commits reached the deploy dispatch having never been tested by anything. This trigger is
# tests only: it reports on a commit that is already merged rather than gating one, and it
# has no bearing on when the deploy runs.
on:
  pull_request:
  push:
    branches: [main]
    # Every merge already ran this suite on the PR, so the push run is a second copy whose
    # only job is catching commits that never went through a PR. Paths that cannot change
    # what the app does are therefore skipped here — and only here; the PR trigger above is
    # unfiltered, so nothing loses coverage, it just stops being tested twice. The list
    # mirrors the one deploy.yml documents for its own (disabled) push trigger, so both
    # workflows agree on what "doesn't affect the app" means.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "marketing/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # for Workload Identity Federation (the plan job)
  pull-requests: write   # to post the plan summary

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System deps for xmlsec (SAML)
        # `apt-get update` is deliberately allowed to fail. The runner image ships
        # third-party apt repos this project doesn't use (Chrome, and friends), and when one
        # of them serves inconsistent metadata the whole update exits 100 — on 2026-09-09
        # dl.google.com published a Release file newer than its Packages.gz and every
        # backend-tests run failed on it, twice in a row, with nothing wrong in the repo.
        # apt says it plainly in that case ("They have been ignored, or old ones used
        # instead"): Ubuntu's own indexes downloaded fine, so the install below works. If a
        # package genuinely can't be found, install still fails and still fails the job —
        # which is the signal we actually care about.
        run: |
          sudo apt-get update || echo "apt-get update reported errors; continuing to install"
          sudo apt-get install -y --no-install-recommends libxml2-dev libxmlsec1-dev libxmlsec1-openssl pkg-config
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Stats band matches the engine
        working-directory: frontend
        # src/stats.gen.json is committed (the Docker web stage has no backend/ in its
        # context); this check is what stops the landing-page numbers drifting from the
        # detector source. Regenerate with `node scripts/gen-stats.mjs` when it fails.
        run: node scripts/gen-stats.mjs --check
      - name: Public claims match the coverage matrix
        working-directory: frontend
        # gen-stats keeps the NUMBERS honest; this keeps the prose honest. A small
        # blocklist of claims that actually shipped and had to be corrected, because
        # marketing copy drifts toward the flattering version one edit at a time.
        run: node scripts/check-claims.mjs
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

  # Prove the self-host path: build the single-origin image via docker compose (the same
  # image CI deploys to Cloud Run) and confirm the stack boots + serves /api/health. This
  # is what keeps self-host from silently drifting out of sync with the app.
  selfhost-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect image-affecting changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            img:
              - 'backend/**'
              - 'frontend/**'
              - 'cli/**'
              - 'proxy/**'
              - 'deploy/cloudrun/**'
              - 'docker-compose.yml'
              - '.env.docker.example'
      - name: Bring up the stack
        if: steps.changes.outputs.img == 'true'
        run: |
          printf 'PALIVANE_SECRET_KEY=%s\nSEED_ON_START=true\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Health check + core detection
        if: steps.changes.outputs.img == 'true'
        run: |
          curl -sf --retry 5 --retry-delay 3 http://localhost:8080/api/health
          # a demo admin is seeded; confirm the app + DB + a real endpoint work end to end
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@demo.local","password":"changeme123"}')
          test "$code" = "200" || { echo "login returned $code"; exit 1; }
          # the /install.sh distribution endpoint must be present in the self-host image too
          curl -sf http://localhost:8080/install.sh | head -1 | grep -q '#!/usr/bin/env bash'
      - name: Logs on failure
        if: failure() && steps.changes.outputs.img == 'true'
        run: docker compose logs --no-color | tail -100
      - name: Teardown
        if: always() && steps.changes.outputs.img == 'true'
        run: docker compose down -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # fmt + validate run on every PR (cheap, no cloud auth) so the config can't go invalid.
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # Did this PR actually touch Terraform? The (cloud-authenticated) plan runs only if so.
      - name: Detect terraform changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            tf:
              - 'deploy/terraform/**'

      # Real plan against remote state — only when TF changed, on same-repo PRs (forks don't
      # get creds), and only when the GCP/WIF variables are configured. The head-repo check
      # is null on a push, so push-to-main runs stop at fmt+validate and never touch cloud
      # credentials — a post-merge plan has no diff left to review anyway. continue-on-error:
      # the WIF trust policy deliberately scopes impersonation to the deploy workflow's
      # refs, so PR-branch runs may be REFUSED a token — that refusal is the trust policy
      # working, not a broken plan. fmt+validate above stay the hard PR gate; the
      # authenticated plan runs wherever the trust policy allows it and is skipped
      # (visibly, as a skipped step) where it doesn't.
      - name: Authenticate to GCP
        id: auth
        continue-on-error: true
        if: >-
          steps.changes.outputs.tf == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
          && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          # Mint a real token NOW (default mode only writes a credential config, so a
          # ref the trust policy excludes "succeeds" here and explodes inside plan).
          token_format: access_token
      - name: Terraform plan
        if: steps.auth.outcome == 'success'
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_image: placeholder-image-ignored-by-lifecycle
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=palivane"
          set -o pipefail
          # Capture the plan to the job summary AND fail the check if plan itself errors
          # (e.g. a missing variable), instead of hiding it.
          terraform plan -no-color -input=false -lock=false 2>&1 | tee plan.txt
          {
            echo '### Terraform plan';
            echo '```';
            tail -c 60000 plan.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
