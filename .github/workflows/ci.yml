name: CI

# PR gate: backend tests, frontend build, Terraform fmt/validate, and (same-repo, when GCP
# creds are configured) a Terraform plan so infra diffs are reviewed before merge.
#
# Also runs on push to main. Not every commit arrives through a PR — deploy.yml is manual
# by design, so shipping a hotfix straight to main is a supported path, and until now those
# commits reached the deploy dispatch having never been tested by anything. This trigger is
# tests only: it reports on a commit that is already merged rather than gating one, and it
# has no bearing on when the deploy runs.
on:
  pull_request:
  push:
    branches: [main]
    # Every merge already ran this suite on the PR, so the push run is a second copy whose
    # only job is catching commits that never went through a PR. Paths that cannot change
    # what the app does are therefore skipped here — and only here; the PR trigger above is
    # unfiltered, so nothing loses coverage, it just stops being tested twice. The list
    # mirrors the one deploy.yml documents for its own (disabled) push trigger, so both
    # workflows agree on what "doesn't affect the app" means.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "marketing/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # for Workload Identity Federation (the plan job)
  pull-requests: write   # to post the plan summary

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No apt step. python3-saml pulls xmlsec as a manylinux wheel whose extension is
      # statically linked (12 MB, no external libxmlsec1/libxml2 references), so the dev
      # headers were only ever needed to COMPILE it — and nothing compiles. The proof this
      # is safe is the production image: deploy/cloudrun/Dockerfile installs libpq5 and curl
      # and nothing else, so SAML has been running on the bundled wheel in prod all along.
      # Removing it also removes the #171 failure mode entirely — no apt, no third-party
      # repo that can take the suite down for an afternoon.
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Pytest
        working-directory: backend
        # -n auto: ~2,220 tests across the runner's cores instead of one. Verified
        # parallel-safe locally on 24 workers, in random order — the suite was already
        # written for it (conftest gives every test its own tmp_path DB and its own
        # PALIVANE_STATE_DIR), so nothing shares state between workers.
        run: python -m pytest -q -n auto

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Stats band matches the engine
        working-directory: frontend
        # src/stats.gen.json is committed (the Docker web stage has no backend/ in its
        # context); this check is what stops the landing-page numbers drifting from the
        # detector source. Regenerate with `node scripts/gen-stats.mjs` when it fails.
        run: node scripts/gen-stats.mjs --check
      - name: Public claims match the coverage matrix
        working-directory: frontend
        # gen-stats keeps the NUMBERS honest; this keeps the prose honest. A small
        # blocklist of claims that actually shipped and had to be corrected, because
        # marketing copy drifts toward the flattering version one edit at a time.
        run: node scripts/check-claims.mjs
      - name: API client is called the way it is defined
        working-directory: frontend
        # `vite build` bundles a bad API call happily — it is only wrong at runtime, and
        # there are no frontend tests. Both OAuth components shipped calling `api` as a
        # function when it is an object of methods, which blanked the consent screen.
        run: node scripts/check-api-calls.mjs
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

  # Prove the self-host path: build the single-origin image via docker compose (the same
  # image CI deploys to Cloud Run) and confirm the stack boots + serves /api/health. This
  # is what keeps self-host from silently drifting out of sync with the app.
  selfhost-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect image-affecting changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            img:
              - 'backend/**'
              - 'frontend/**'
              - 'cli/**'
              - 'proxy/**'
              - 'deploy/cloudrun/**'
              - 'docker-compose.yml'
              - '.env.docker.example'
      - name: Bring up the stack
        if: steps.changes.outputs.img == 'true'
        run: |
          printf 'PALIVANE_SECRET_KEY=%s\nSEED_ON_START=true\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Health check + core detection
        if: steps.changes.outputs.img == 'true'
        run: |
          curl -sf --retry 5 --retry-delay 3 http://localhost:8080/api/health
          # a demo admin is seeded; confirm the app + DB + a real endpoint work end to end
          tok=$(curl -s -X POST http://localhost:8080/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@demo.local","password":"changeme123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')
          [ -n "$tok" ] || { echo "login failed"; exit 1; }
          # The step is called "core detection", so detect something. Health plus a login
          # proves the container and the database are up; it says nothing about whether the
          # product still works, which is the failure this job exists to catch.
          out=$(curl -sf -X POST http://localhost:8080/api/analyze \
            -H "authorization: Bearer $tok" -H 'content-type: application/json' \
            -d '{"content":"here is the key AKIA4YTGH2NBQF7XZP3K please use it","subject":"ci","surface":"ai_usage","persist":true}')
          echo "$out"
          python3 - "$out" <<'CHECK'
          import json, sys
          v = json.loads(sys.argv[1])
          cats = {s.get("category") for s in (v.get("signals") or [])}
          assert "secret_leak" in cats, f"no secret_leak signal; got {cats}"
          print("detection ok:", v.get("severity"), sorted(c for c in cats if c))
          CHECK
          # the /install.sh distribution endpoint must be present in the self-host image too
          curl -sf http://localhost:8080/install.sh | head -1 | grep -q '#!/usr/bin/env bash'
      - name: Logs on failure
        if: failure() && steps.changes.outputs.img == 'true'
        run: docker compose logs --no-color | tail -100
      - name: Teardown
        if: always() && steps.changes.outputs.img == 'true'
        run: docker compose down -v

  # The deployment README calls "recommended for real deployments" — and until now the only
  # one with no automated test. deploy/native/'s two smoke scripts cover the ENDPOINT
  # installer's CA trust stores, not the server. This installs the real release tarball the
  # way a customer does (as root, systemd, Postgres) and asserts the things a customer would
  # notice broken: the service starts, RLS is actually applied, detection actually detects,
  # and a placeholder signing key actually refuses to boot.
  native-install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: palivane
          POSTGRES_PASSWORD: palivane
          POSTGRES_DB: palivane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U palivane" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect changes that affect the server install
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            native:
              - 'backend/**'
              - 'frontend/**'
              - 'cli/**'
              - 'proxy/**'
              - 'deploy/native/**'
              - 'deploy/palivane.env.example'
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.native == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.native == 'true'
        with:
          node-version: "24"

      - name: Build the release tarball
        if: steps.changes.outputs.native == 'true'
        run: ./deploy/native/build-release.sh

      - name: Install it the way a customer does
        if: steps.changes.outputs.native == 'true'
        run: |
          set -euo pipefail
          tar xzf dist/palivane-native-*.tar.gz -C /tmp
          sudo /tmp/palivane/install.sh            # first run: generates env, SQLite, systemd

      - name: Repoint at Postgres and re-install (the production shape, and idempotency)
        if: steps.changes.outputs.native == 'true'
        run: |
          set -euo pipefail
          sudo sed -i "s#^DATABASE_URL=.*#DATABASE_URL=postgresql+psycopg2://palivane:palivane@127.0.0.1:5432/palivane#" \
            /etc/palivane/palivane.env
          sudo /tmp/palivane/install.sh            # second run must be a no-op apart from migrations
          sudo systemctl restart palivane-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8088/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8088/api/health

      - name: Row-level security is actually applied
        if: steps.changes.outputs.native == 'true'
        # /trust tells buyers "RLS policies on every tenant-scoped table". The migration is a
        # no-op off Postgres, so this is the only place that claim gets checked against a
        # real database rather than against the migration file.
        run: |
          set -euo pipefail
          n=$(PGPASSWORD=palivane psql -h 127.0.0.1 -U palivane -d palivane -tAc \
                "select count(*) from pg_policies where schemaname='public'")
          echo "RLS policies: $n"
          test "$n" -gt 0 || { echo "no RLS policies — tenant isolation is not enforced in the DB"; exit 1; }

      - name: The console is served, and detection actually detects
        if: steps.changes.outputs.native == 'true'
        run: |
          set -euo pipefail
          # SPA comes off PALIVANE_STATIC_DIR, not a separate web container.
          curl -sf http://127.0.0.1:8088/ | grep -qi "<!doctype html" || { echo "SPA not served"; exit 1; }

          sudo palivane-admin create-tenant --slug acme --name "Acme"
          sudo palivane-admin create-user --tenant acme --email admin@acme.local \
            --role admin --password 'ci-Passw0rd!-long-enough'
          TOK=$(curl -sf -X POST http://127.0.0.1:8088/api/auth/login \
                 -H 'content-type: application/json' \
                 -d '{"email":"admin@acme.local","password":"ci-Passw0rd!-long-enough","org":"acme"}' \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          [ -n "$TOK" ] || { echo "login failed"; exit 1; }

          # The documented test payload. If this stops being a finding, the product is broken
          # in the one way no health check would ever show.
          out=$(curl -sf -X POST http://127.0.0.1:8088/api/analyze \
                 -H "authorization: Bearer $TOK" -H 'content-type: application/json' \
                 -d '{"content":"here is the key AKIA4YTGH2NBQF7XZP3K please use it","subject":"ci","surface":"ai_usage","persist":true}')
          echo "$out"
          python3 - "$out" <<'CHECK'
          import json, sys
          v = json.loads(sys.argv[1])
          cats = {s.get("category") for s in (v.get("signals") or [])}
          assert "secret_leak" in cats, f"no secret_leak signal; got {cats}"
          assert v.get("severity") in ("high", "critical"), f"severity={v.get('severity')}"
          print("detection ok:", v.get("severity"), sorted(c for c in cats if c))
          CHECK

      - name: A placeholder signing key must refuse to boot
        if: steps.changes.outputs.native == 'true'
        # Proves the guard in the real deployment, not just in a unit test: on Postgres a
        # known key means forgeable admin sessions for every tenant.
        run: |
          set -euo pipefail
          sudo cp /etc/palivane/palivane.env /tmp/palivane.env.bak
          sudo sed -i "s#^PALIVANE_SECRET_KEY=.*#PALIVANE_SECRET_KEY=replace-me-with-a-long-random-secret#" \
            /etc/palivane/palivane.env
          sudo systemctl restart palivane-api || true
          sleep 6
          if systemctl is-active --quiet palivane-api && curl -sf http://127.0.0.1:8088/api/health; then
            echo "FAIL: booted with a placeholder signing key"; exit 1
          fi
          echo "refused to boot, as it should"
          sudo cp /tmp/palivane.env.bak /etc/palivane/palivane.env
          sudo systemctl restart palivane-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8088/api/health && break; sleep 2; done

      - name: Service logs on failure
        if: failure() && steps.changes.outputs.native == 'true'
        run: sudo journalctl -u palivane-api -n 120 --no-pager || true

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # fmt + validate run on every PR (cheap, no cloud auth) so the config can't go invalid.
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # Did this PR actually touch Terraform? The (cloud-authenticated) plan runs only if so.
      - name: Detect terraform changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            tf:
              - 'deploy/terraform/**'

      # Real plan against remote state — only when TF changed, on same-repo PRs (forks don't
      # get creds), and only when the GCP/WIF variables are configured. The head-repo check
      # is null on a push, so push-to-main runs stop at fmt+validate and never touch cloud
      # credentials — a post-merge plan has no diff left to review anyway. continue-on-error:
      # the WIF trust policy deliberately scopes impersonation to the deploy workflow's
      # refs, so PR-branch runs may be REFUSED a token — that refusal is the trust policy
      # working, not a broken plan. fmt+validate above stay the hard PR gate; the
      # authenticated plan runs wherever the trust policy allows it and is skipped
      # (visibly, as a skipped step) where it doesn't.
      - name: Authenticate to GCP
        id: auth
        continue-on-error: true
        if: >-
          steps.changes.outputs.tf == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
          && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          # Mint a real token NOW (default mode only writes a credential config, so a
          # ref the trust policy excludes "succeeds" here and explodes inside plan).
          token_format: access_token
      - name: Terraform plan
        if: steps.auth.outcome == 'success'
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_image: placeholder-image-ignored-by-lifecycle
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=palivane"
          set -o pipefail
          # Capture the plan to the job summary AND fail the check if plan itself errors
          # (e.g. a missing variable), instead of hiding it.
          terraform plan -no-color -input=false -lock=false 2>&1 | tee plan.txt
          {
            echo '### Terraform plan';
            echo '```';
            tail -c 60000 plan.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
