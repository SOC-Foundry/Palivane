name: Sync public clients mirror

# Mirrors the endpoint-component directories (extension/ cli/ proxy/ mcp-server/ git/
# vscode-extension/) to the
# public SOC-Foundry/palivane-clients repo whenever they change on main. The public repo's
# LICENSE and README are owned there and never overwritten; build artifacts, virtualenvs,
# and the internal store runbook never leave.
#
# Auth: CLIENTS_SYNC_TOKEN — a fine-grained PAT scoped to SOC-Foundry/palivane-clients
# with Contents read/write ONLY (deploy keys are disabled org-wide on purpose; a
# one-repo token is the narrower credential). Until the secret exists this workflow
# no-ops with a notice instead of failing.
on:
  push:
    branches: [main]
    # This list includes THIS FILE on purpose. Adding a directory to the mirror is a change
    # to the workflow and usually to nothing else, so without that entry the very commit
    # that widens the mirror does not match its own filter and never runs — the new
    # component stays unpublished until somebody happens to edit a file inside it. That is
    # exactly what happened when vscode-extension/ was added (PR #262): the merge triggered
    # nothing and the extension stayed unobtainable until the workflow was dispatched by
    # hand. git/ escaped it only by luck, because that PR also moved a file the filter
    # already matched.
    paths:
      - "extension/**"
      - "cli/**"
      - "proxy/**"
      - "mcp-server/**"
      - "git/**"
      - "vscode-extension/**"
      - ".pre-commit-hooks.yaml"
      - ".github/workflows/sync-clients.yml"
  # Backstop. The push trigger only fires on a matching change, so anything that puts the
  # mirror out of step WITHOUT one leaves it stale indefinitely: a transient failure, a
  # direct commit to the mirror, a path added through some route the filter misses. A daily
  # reconcile costs about fifteen seconds — the job exits at "mirror already current" when
  # there is no diff — and means the worst case for drift is a day rather than forever.
  # NOTE: GitHub disables scheduled workflows in a repo with no activity for 60 days.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-clients
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mirror to palivane-clients
        env:
          TOKEN: ${{ secrets.CLIENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLIENTS_SYNC_TOKEN not set — public mirror NOT synced (set the secret to enable)"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/SOC-Foundry/palivane-clients.git" /tmp/mirror
          for d in extension cli proxy mcp-server git vscode-extension; do
            # *.vsix is deliberately NOT excluded despite being a build artifact: it is
            # the file customers install (`code --install-extension`), there is no
            # Marketplace listing yet and the backend does not serve it, so the mirror is
            # the only place they can get it. 31KB.
            rsync -a --delete \
              --exclude "*.zip" --exclude "STORE.md" --exclude "__pycache__" --exclude ".venv" \
              --exclude "node_modules" \
              "$d/" "/tmp/mirror/$d/"
          done
          # pre-commit reads its manifest from the CLONE ROOT, so the hook repo is the
          # mirror, not this one: the root copy must travel with git/.
          cp .pre-commit-hooks.yaml /tmp/mirror/.pre-commit-hooks.yaml
          cd /tmp/mirror
          git add -A
          if git diff --cached --quiet; then
            echo "mirror already current"
            exit 0
          fi
          # Name the trigger in the message. A scheduled run that finds a diff means the
          # mirror had drifted out of step with main and nothing had noticed — worth being
          # able to spot in the log rather than having it look like an ordinary push sync.
          case "${GITHUB_EVENT_NAME}" in
            schedule) WHY="reconcile: the daily check found the mirror out of step" ;;
            workflow_dispatch) WHY="sync: mirrored on request" ;;
            *) WHY="sync: mirror endpoint components from the main repository" ;;
          esac
          echo "changed:"; git diff --cached --name-status | sed 's/^/  /'
          git -c user.name="palivane-sync" -c user.email="noreply@palivane.io" \
            commit -m "$WHY

          Source: SOC-Foundry/Palivane@${GITHUB_SHA} (${GITHUB_EVENT_NAME})"
          git push
          echo "mirror updated to ${GITHUB_SHA}"
