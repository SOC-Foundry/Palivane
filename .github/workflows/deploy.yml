name: Deploy (Cloud Run)

# App rollout: build + push the image (Cloud Build) and deploy to Cloud Run via the
# existing deploy script. Infra changes are handled separately by terraform-apply.yml.
# Requires Workload Identity Federation + a deploy service account.
#
# MANUAL ONLY. The push-to-main trigger is deliberately absent: it shipped straight to
# production with nothing in between, and the usual brake for that, required reviewers on
# the production environment, needs a paid plan (the org is on free, and the repo is
# private, so the API refuses the protection rule). Dispatching by hand is the gate
# instead, the same arrangement terraform-apply.yml already uses.
#
# To restore automatic rollout once required reviewers are available, put back:
#   push:
#     branches: [main]
#     paths-ignore: ["deploy/terraform/**", "deploy/gcp/**", ".github/**", "**/*.md", "docs/**"]
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # add required reviewers here for a manual gate
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build + deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SQL_CONNECTION: ${{ vars.GCP_SQL_CONNECTION }}
          VPC_NETWORK: ${{ vars.VPC_NETWORK }}
          VPC_SUBNET: ${{ vars.VPC_SUBNET }}
          # Never grant allUsers run.invoker from CI. The origin is reachable only through
          # the Cloudflare Worker, which authenticates as palivane-front; a public invoker
          # would let anyone bypass the WAF and rate limiting and hit Cloud Run directly.
          # deploy.sh defaults to --allow-unauthenticated, so this has to be explicit.
          NO_UNAUTH: "1"
          # Posture + fronting — set as repo/environment variables (not secrets; non-sensitive).
          GATEWAY_ENFORCE: ${{ vars.GATEWAY_ENFORCE }}
          JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          PALIVANE_JUDGE_PLAN_GATED: ${{ vars.PALIVANE_JUDGE_PLAN_GATED }}
          PALIVANE_ALLOW_SIGNUP: ${{ vars.PALIVANE_ALLOW_SIGNUP }}
          PALIVANE_ENCRYPT_FINDINGS: ${{ vars.PALIVANE_ENCRYPT_FINDINGS }}
          DOMAIN: ${{ vars.DOMAIN }}
          # The site and the console are on different hosts here — palivane.io serves the
          # public site, this service is the console (deploy/cloudflare/worker.js does the
          # split). The SPA is built with the console's origin so "Sign in" on a marketing
          # page crosses hosts; a same-origin sign-in on the apex would store the token in
          # an origin the console cannot read. Keep this in step with worker.js APP_HOST.
          PALIVANE_APP_ORIGIN: https://app.palivane.io
          PALIVANE_ALLOWED_HOSTS: ${{ vars.PALIVANE_ALLOWED_HOSTS }}
          PALIVANE_EXTENSION_ID: ${{ vars.PALIVANE_EXTENSION_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          CF_EMAIL_ACCOUNT_ID: ${{ vars.CF_EMAIL_ACCOUNT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          PALIVANE_DEMO_ORG: ${{ vars.PALIVANE_DEMO_ORG }}
          # "1" only for a SELF-HOSTED build. Unset here on purpose: this workflow deploys
          # the managed service, and the managed copy is what an unset flag yields (see
          # deploy/cloudrun/Dockerfile). Left wired so a fork deploying its own install can
          # set the variable and get the stronger, true claim.
          PALIVANE_SELF_HOSTED: ${{ vars.PALIVANE_SELF_HOSTED }}
          PALIVANE_MCP_REPUTATION_FEED: ${{ vars.PALIVANE_MCP_REPUTATION_FEED }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PRICE_TEAM_MONTHLY: ${{ vars.STRIPE_PRICE_TEAM_MONTHLY }}
          STRIPE_PRICE_TEAM_ANNUAL: ${{ vars.STRIPE_PRICE_TEAM_ANNUAL }}
          # Role-based S3 delivery (AWS identity via GCP web-identity federation) and the
          # published Slack app. All non-sensitive; the Slack client SECRET comes from
          # Secret Manager (palivane-slack-client-secret) inside deploy.sh.
          PALIVANE_AWS_WIF_ROLE_ARN: ${{ vars.PALIVANE_AWS_WIF_ROLE_ARN }}
          PALIVANE_AWS_DELIVERY_PRINCIPAL: ${{ vars.PALIVANE_AWS_DELIVERY_PRINCIPAL }}
          PALIVANE_SLACK_CLIENT_ID: ${{ vars.PALIVANE_SLACK_CLIENT_ID }}
          PALIVANE_SLACK_REDIRECT_URL: ${{ vars.PALIVANE_SLACK_REDIRECT_URL }}
        run: ./deploy/cloudrun/deploy.sh
