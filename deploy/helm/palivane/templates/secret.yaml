{{- if not .Values.existingSecret }}
{{- if not .Values.databaseUrl }}{{ fail "set databaseUrl (or existingSecret)" }}{{ end }}
{{- if not .Values.secretKey }}{{ fail "set secretKey (openssl rand -hex 32) or existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "palivane.secretName" . }}
  labels: {{- include "palivane.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
  PALIVANE_SECRET_KEY: {{ .Values.secretKey | quote }}
{{- end }}
