# Build the single-origin Warden image and push to Artifact Registry.
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#     --substitutions _REGION=us-central1,_REPO=warden,_IMAGE=warden,_TAG=$(git rev-parse --short HEAD)
substitutions:
  _REGION: us-central1
  _REPO: warden
  _IMAGE: warden
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/cloudrun/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
options:
  machineType: E2_HIGHCPU_8
  # Log to Cloud Logging only. The default (GCS + streaming) requires the submitter to be
  # project Viewer/Owner to stream; the CI Workload Identity SA isn't, so the stream errors
  # and aborts the build under `set -e`. CLOUD_LOGGING_ONLY avoids the GCS-stream path.
  logging: CLOUD_LOGGING_ONLY
