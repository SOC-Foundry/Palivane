# Build the single-origin Warden image and push to Artifact Registry.
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#     --substitutions _REGION=us-central1,_REPO=warden,_IMAGE=warden,_TAG=$(git rev-parse --short HEAD)
substitutions:
  _REGION: us-central1
  _REPO: warden
  _IMAGE: warden
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/cloudrun/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
options:
  machineType: E2_HIGHCPU_8
