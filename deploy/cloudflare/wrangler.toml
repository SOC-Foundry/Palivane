name = "palivane-front"
main = "worker.js"
compatibility_date = "2026-07-01"
# TODO(setup): this is still the OLD TachTech account id (which owns tachtech.net).
# palivane.io lives on a different Cloudflare account — replace this with that account's
# id before deploying, or wrangler will push to the wrong account.
account_id = "REPLACE_WITH_PALIVANE_IO_ACCOUNT_ID"

# Both routes need PROXIED (orange-cloud) DNS records in the palivane.io zone — the
# wrangler token can't create DNS, so add them in the Cloudflare dashboard first. Once
# they exist, `wrangler deploy` activates these routes.
routes = [
  { pattern = "app.palivane.io/*", zone_name = "palivane.io" },
  # Apex proxies the same backend; browser navigation 301s to app.palivane.io (worker.js).
  { pattern = "palivane.io/*", zone_name = "palivane.io" }
]

# Exact per-IP edge rate limiting for auth endpoints (credential-stuffing shield).
# A Durable Object per source IP — free-plan compatible (SQLite-backed class).
[durable_objects]
bindings = [
  { name = "RATE", class_name = "RateCounter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateCounter"]
