name = "palivane-front"
main = "worker.js"
compatibility_date = "2026-07-01"
# The account that owns the palivane.io zone — pinned so wrangler never deploys to
# another account by mistake.
account_id = "e877e5d440048df1624a3512143c1281"

# Both routes need PROXIED (orange-cloud) DNS records in the palivane.io zone — the
# wrangler token can't create DNS, so add them in the Cloudflare dashboard first. Once
# they exist, `wrangler deploy` activates these routes.
# Both hosts hit the same worker and the same origin; worker.js decides which pages belong
# to which. app.palivane.io is the console and the API, palivane.io is the public site.
routes = [
  { pattern = "app.palivane.io/*", zone_name = "palivane.io" },
  { pattern = "palivane.io/*", zone_name = "palivane.io" }
]

# The Cloud Run service this fronts. Kept here rather than in worker.js so the Worker
# source stays environment-agnostic — and doubles as the ID token's target_audience.
[vars]
ORIGIN = "https://palivane-yuu7trypzq-uc.a.run.app"

# Exact per-IP edge rate limiting for auth endpoints (credential-stuffing shield).
# A Durable Object per source IP — free-plan compatible (SQLite-backed class).
[durable_objects]
bindings = [
  { name = "RATE", class_name = "RateCounter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateCounter"]
