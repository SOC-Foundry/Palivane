apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.name" . }}
  labels:
    {{- include "warden.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "warden.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "warden.name" . }}
      {{- if .Values.nodePool.isolate }}
      # Land only on this customer's dedicated node pool (Terraform taints + labels it).
      nodeSelector:
        warden-customer: {{ .Values.customer | quote }}
      tolerations:
        - key: dedicated
          operator: Equal
          value: {{ .Values.customer | quote }}
          effect: NoSchedule
      {{- end }}
      initContainers:
        # Cloud SQL Auth Proxy as a NATIVE sidecar (starts before, runs alongside the app).
        - name: cloud-sql-proxy
          image: {{ .Values.cloudsql.proxyImage }}
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--port=5432"
            - {{ .Values.cloudsql.connectionName | quote }}
          securityContext:
            runAsNonRoot: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
      containers:
        - name: warden
          image: "{{ .Values.image.repo }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: WARDEN_PUBLIC_URL
              value: "https://{{ .Values.host }}"
            - name: CORS_ORIGINS
              value: "https://{{ .Values.host }}"
            - name: WARDEN_ALLOWED_HOSTS
              value: {{ .Values.host | quote }}
            - name: GATEWAY_ENFORCE
              value: {{ .Values.config.gatewayEnforce | quote }}
            - name: WARDEN_ALLOW_SIGNUP
              value: {{ .Values.config.allowSignup | quote }}
            - name: WARDEN_ENCRYPT_FINDINGS
              value: {{ .Values.config.encryptFindings | quote }}
            - name: WARDEN_STORE_CONTENT
              value: {{ .Values.config.storeContent | quote }}
            - name: WARDEN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: WARDEN_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: DATABASE_URL
          readinessProbe:
            httpGet: { path: /api/health, port: {{ .Values.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: {{ .Values.port }} }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
