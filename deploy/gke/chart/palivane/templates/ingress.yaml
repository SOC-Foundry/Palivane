{{- if .Values.managedCertificate }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "palivane.name" . }}-cert
  labels:
    {{- include "palivane.labels" . | nindent 4 }}
spec:
  domains:
    - {{ .Values.host }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "palivane.name" . }}
  labels:
    {{- include "palivane.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: "gce"
    {{- if .Values.managedCertificate }}
    networking.gke.io/managed-certificates: {{ include "palivane.name" . }}-cert
    {{- end }}
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "palivane.name" . }}
                port:
                  number: 80
