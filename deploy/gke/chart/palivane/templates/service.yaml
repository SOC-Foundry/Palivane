apiVersion: v1
kind: Service
metadata:
  name: {{ include "palivane.name" . }}
  labels:
    {{- include "palivane.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'   # container-native LB (NEG) for the GCE ingress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.port }}
