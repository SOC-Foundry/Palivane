apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "palivane.name" . }}
  labels:
    {{- include "palivane.labels" . | nindent 4 }}
  {{- if .Values.gcpServiceAccount }}
  annotations:
    # Workload Identity: this KSA acts as the customer's Google SA (Cloud SQL + secrets).
    iam.gke.io/gcp-service-account: {{ .Values.gcpServiceAccount }}
  {{- end }}
